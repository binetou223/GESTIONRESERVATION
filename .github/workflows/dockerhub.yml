name: Publish Docker image

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

env:
  IMAGE_NAME: binetou22/gestiondereservation

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: binetou22
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Collect all existing tags
        id: all-tags
        shell: bash
        run: |
          {
            echo 'tags<<EOF'
            git tag --list \
              | sed 's#[^A-Za-z0-9_.-]#-#g' \
              | sed 's#^#${{ env.IMAGE_NAME }}:#'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.all-tags.outputs.tags }}
